# Cards for the plant family section of index.qmd, in display order.
#
# Each tool (only `name` and `description` are required). The same fields are used in every card file (data/austraits.yml, plant.yml, havplot.yml, packages.yml).
#   name         display name
#   kind         short label: "R package", "Web app", "Database", "C++ library", ...
#   status       stable | developing | experimental   (shown as a badge; omit for none)
#   description  one or two sentences (plain text)
#   repo         repository name under github.com/traitecoevo (adds a GitHub link)
#   private      true if the repository is not public yet (shows "Not yet public" instead of a GitHub link)
#   home         main link: docs site, website or app (the card title links here; falls back to the repo)
#   home_label   label for the home link (default "Docs")
#   logo         file name in assets/logos/ (otherwise a two-letter tile is drawn)
#   cran         true if on CRAN (adds a CRAN link)
#   universe     true if on traitecoevo.r-universe.dev (adds an R-universe link)
#   links        extra links, as a list of {label, url}

- name: plant
  kind: R package · C++
  status: stable
  description: Trait-driven models of size-, patch- and trait-structured forest demography, ecology and evolution.
  repo: plant
  home: https://traitecoevo.github.io/plant/
  universe: true
- name: Overstorey
  kind: Guide
  status: developing
  description: A field guide to the plant model, with user guides, theory and worked notebooks.
  repo: overstorey
  home: https://traitecoevo.github.io/overstorey/
  home_label: Guide
- name: regnans
  kind: R package
  status: developing
  description: Extends plant to community assembly and trait evolution, with solvers for resident equilibria and invasion fitness.
  repo: regnans
- name: fieldtrial
  kind: R package
  status: experimental
  description: Sets up plant runs by bundling a site's environmental drivers with species' trait trade-offs and sourced parameter sets.
  repo: fieldtrial
- name: odelia
  kind: C++ library · R
  status: developing
  description: A fast, header-only C++ ODE solver with reverse-mode automatic differentiation and an R interface.
  repo: odelia
  home: https://traitecoevo.github.io/odelia/
- name: phylloptim
  kind: C++ · R
  status: experimental
  description: A leaf gas-exchange model in which stomatal behaviour emerges from plant hydraulics through gain–risk optimisation.
  repo: phylloptim
- name: framecpp
  kind: C++ · R
  status: experimental
  description: Forest flammability using FRaME fire mechanics in C++, generalised from discrete strata to continuous size distributions.
  repo: framecpp
- name: standViz
  kind: R package
  status: experimental
  description: Interactive 3D views of forest stands simulated with plant, drawn as individual trees growing through time.
  repo: standViz
